# AWS Amplify Hosting build settings (picked up automatically from the repo root).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 7 needs Node 20.19+; pin 22 like local dev.
        - nvm install 22 && nvm use 22
        - npm ci
    build:
      commands:
        # VITE_API_URL comes from the Amplify app's environment variables.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
